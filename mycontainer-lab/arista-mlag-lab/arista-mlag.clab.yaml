name: arista-mlag-lab

topology:
  nodes:
    # MLAG peers
    ceos1:
      kind: arista_ceos
      image: ceos:4.32.0F

    ceos2:
      kind: arista_ceos
      image: ceos:4.32.0F

    # Downstream Access switch 1
    ceos3:
      kind: arista_ceos
      image: ceos:4.32.0F

    # Downstream Access switch 2
    ceos4:
      kind: arista_ceos
      image: ceos:4.32.0F


  links:
    # MLAG Peer to Peer Connection
    - endpoints: ["ceos1:eth1", "ceos2:eth1"]
    - endpoints: ["ceos1:eth2", "ceos2:eth2"]

    # Arista dual-homed links to MLAG - Access sw1
    - endpoints: ["ceos1:eth3", "ceos3:eth1"]
    - endpoints: ["ceos2:eth3", "ceos3:eth2"]

    # Arista dual-homed links to MLAG - Access sw1   
    - endpoints: ["ceos1:eth4", "ceos4:eth1"]
    - endpoints: ["ceos2:eth4", "ceos4:eth2"]

