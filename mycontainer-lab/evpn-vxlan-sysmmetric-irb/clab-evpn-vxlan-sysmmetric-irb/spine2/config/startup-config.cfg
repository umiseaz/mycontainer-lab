    ##
    bgp {
        group underlay {
            type external;
            family inet {
                unicast;
            }
            export export-loopback;
            multipath;
            neighbor 10.2.1.2 {
                peer-as 65401;
            }
            neighbor 10.2.2.2 {
                peer-as 65402;
            }
            neighbor 10.2.3.2 {
                peer-as 65403;
            }
        }
        group overlay {
            type external;
            multihop {
                no-nexthop-change;
            }
            local-address 10.255.255.102;
            multipath;
            neighbor 10.254.254.1 {
                family evpn {
                    signaling;
                }
                peer-as 65401;
            }
            neighbor 10.254.254.2 {
                family evpn {
                    signaling;
                }
                peer-as 65402;
            }
            neighbor 10.254.254.3 {
