    policy-statement ECMP {
        then {
            load-balance per-flow;
        }
    }
    policy-statement export-loopback {
        term 1 {
            from {
                route-filter 10.255.255.0/24 orlonger;
            }
            then accept;
        }
        term 2 {
            from {
                route-filter 10.254.254.0/24 orlonger;
            }
            then accept;
        }
        then reject;
    }
