policy-options {
    policy-statement ECMP {
        then {
            load-balance per-flow;
        }
    }
    policy-statement export-loopback {
        from interface lo0.0;
        then accept;
    }
}
routing-instances {
    macvrf-1 {
        instance-type mac-vrf;
        protocols {
            evpn {
                encapsulation vxlan;
                default-gateway do-not-advertise;
                extended-vni-list all;
            }
        }
        vtep-source-interface lo0.0;
        service-type vlan-aware;
        interface ge-0/0/2.0;
        route-distinguisher 10.254.254.1:1;
        vrf-target target:65000:1;
        vlans {
            vlan-100 {
                vlan-id 100;
                l3-interface irb.100;
                ##
                ## Warning: requires 'vxlan' license
                ##
                vxlan {
                    vni 10100;
                }
            }
        }
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
    tenant1 {
        instance-type vrf;
        protocols {
            evpn {
                irb-symmetric-routing {
                    vni 50500;
                }
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni 50500;
                }
            }
        }
        interface irb.100;
        route-distinguisher 10.254.254.1:50500;
        vrf-target target:65000:50500;
    }
}
routing-options {
    router-id 10.254.254.1;
    autonomous-system 65401;
    forwarding-table {
        export ECMP;
    }
}
protocols {
    ##
    ## Warning: requires 'bgp' license
    ##
    bgp {
        group underlay {
            type external;
            family inet {
                unicast;
            }
            export export-loopback;
            multipath;
            neighbor 10.1.1.1 {
                peer-as 65000;
            }
            neighbor 10.2.1.1 {
                peer-as 65000;
            }
        }
        group overlay {
            type external;
            multihop;
            local-address 10.254.254.1;
            family evpn {
                signaling;
            }
            peer-as 65000;
            multipath;
            neighbor 10.255.255.101;
            neighbor 10.255.255.102;
        }
    }
}