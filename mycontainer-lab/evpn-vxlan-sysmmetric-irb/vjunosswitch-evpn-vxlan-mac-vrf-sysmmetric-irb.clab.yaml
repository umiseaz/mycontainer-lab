name: evpn-vxlan-sysmmetric-irb
topology:
  nodes:
    spine1:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:23.1R1.8
    spine2:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:23.1R1.8
    leaf1:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:23.1R1.8
    leaf2:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:23.1R1.8
    leaf3:
      kind: juniper_vjunosswitch
      image: vrnetlab/juniper_vjunos-switch:23.1R1.8
    host1:
      kind: linux
      image: alpine:latest
    host2:
      kind: linux
      image: alpine:latest
    host3:
      kind: linux
      image: alpine:latest
    host4:
      kind: linux
      image: alpine:latest
  links:
    # Spine to Leaf connections
    - endpoints: [ "spine1:eth1", "leaf1:eth1" ]
    - endpoints: [ "spine1:eth2", "leaf2:eth1" ]
    - endpoints: [ "spine1:eth3", "leaf3:eth1" ]
    - endpoints: [ "spine2:eth1", "leaf1:eth2" ]
    - endpoints: [ "spine2:eth2", "leaf2:eth2" ]
    - endpoints: [ "spine2:eth3", "leaf3:eth2" ]

    # Host connection to leaf1
    - endpoints: [ "leaf1:eth3", "host1:eth1" ]
    - endpoints: [ "leaf2:eth3", "host2:eth1" ]
    - endpoints: [ "leaf2:eth4", "host3:eth1" ]
    - endpoints: [ "leaf3:eth3", "host4:eth1" ]
