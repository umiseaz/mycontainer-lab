interfaces {
    ge-0/0/0 {
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/1 {
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/2 {
        ether-options {
            802.3ad ae1;
        }
    }
    ge-0/0/3 {
        ether-options {
            802.3ad ae1;
        }
    }
    ge-0/0/4 {
        ether-options {
            802.3ad ae10;
        }
    }
    ae0 {
        description "ICCP - control plane";
        aggregated-ether-options {
            lacp {
                active;
                periodic fast;
            }
        }
        unit 0 {
            family inet {
                address 10.0.0.2/30;
            }
        }
    }
    ae1 {
        description "ICL - Data plane - Trunk";
        aggregated-ether-options {
            lacp {
                active;
                periodic fast;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members all;
                }
            }
        }
    }
    ae10 {
        description "to Arista switch";
        aggregated-ether-options {
            lacp {
                active;
                periodic fast;
                system-id 00:00:00:00:00:10;
                admin-key 10;
            }
            mc-ae {
                mc-ae-id 10;
                redundancy-group 1;
                chassis-id 1;
                mode active-active;
                status-control standby;
                init-delay-time 240;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members all;
                }
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    irb {
        arp-l2-validate;
        unit 10 {
            family inet {
                address 192.168.1.2/24 {
                    arp 192.168.1.1 l2-interface ae1.0 mac 2c:6b:f5:2d:dd:f0;
                    vrrp-group 10 {
                        virtual-address 192.168.1.3;
                        priority 100;
                        preempt;
                        accept-data;
                    }
                }
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 1.1.1.2/30;
            }
        }
    }
}
multi-chassis {
    multi-chassis-protection 1.1.1.1 {
        interface ae1;
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    router-id 1.1.1.2;
}
protocols {
    iccp {
        local-ip-addr 1.1.1.2;
        peer 1.1.1.1 {
            session-establishment-hold-time 50;
            redundancy-group-id-list 1;
            liveness-detection {
                minimum-interval 2000;
                multiplier 4;
            }
        }
    }
    ospf {
        area 0.0.0.0 {
            interface ae0.0 {
                interface-type p2p;
            }
            interface lo0.0;
        }
    }
    lldp {
        interface all;
    }
}
switch-options {
    service-id 1;
}
vlans {
    v10 {
        vlan-id 10;
        l3-interface irb.10;
    }
}