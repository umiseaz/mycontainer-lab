        ##
        vxlan {
            vni 1010;
        }
    }
    vlan-20 {
        vlan-id 20;
        l3-interface irb.20;
        ##
        ## Warning: requires 'vxlan' license
        ##
        vxlan {
            vni 2020;
        }
    }
}