policy-options {
    policy-statement LB-POLICY {
        then {
            load-balance per-packet;
        }
    }
    policy-statement V10-EXPORT-POLICY {
        term 1 {
            from protocol direct;
            then {
                community add comm-v10;
                accept;
            }
        }
        inactive: term 2 {
            from protocol local;
            then {
                community add comm-v10;
                accept;
            }
        }
        then reject;
    }
    policy-statement V10-IMPORT-POLICY {
        term 1 {
            from community comm-v20;
            then accept;
        }
        then reject;
    }
    policy-statement V20-EXPORT-POLICY {
        term 1 {
            from protocol direct;
            then {
                community add comm-v20;
                accept;
            }
        }
        inactive: term 2 {
            from protocol local;
            then {
                community add comm-v20;
                accept;
            }
        }
        then reject;
    }
    policy-statement V20-IMPORT-POLICY {
        term 1 {
            from community comm-v10;
            then accept;
        }
        then reject;
    }
    community comm-v10 members target:65000:1010;
    community comm-v20 members target:65000:2020;
}
routing-instances {
    V10 {
        instance-type vrf;
        routing-options {
            auto-export;
        }
        protocols {
            evpn {
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni 112210;
                }
            }
        }
        interface irb.10;
        route-distinguisher 11.11.11.11:10;
        inactive: vrf-import V10-IMPORT-POLICY;
        inactive: vrf-export V10-EXPORT-POLICY;
        vrf-target target:65000:1010;
    }
    V20 {
        instance-type vrf;
        routing-options {
            auto-export;
        }
        protocols {
            evpn {
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni 112220;
                }
            }
        }
        interface irb.20;
        route-distinguisher 11.11.11.11:20;
        inactive: vrf-import V20-IMPORT-POLICY;
        inactive: vrf-export V20-EXPORT-POLICY;
        vrf-target target:65000:2020;
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    router-id 11.11.11.11;
    autonomous-system 65000;
    forwarding-table {
        export LB-POLICY;
    }
}
protocols {
    ##
    ## Warning: requires 'bgp' license
    ##
    bgp {
        group RR-CLIENT {
            type internal;
            local-address 11.11.11.11;
            family evpn {
                signaling;
            }
            cluster 0.0.0.1;
            peer-as 65000;
            neighbor 1.1.1.1;
            neighbor 2.2.2.2;
        }
    }
    evpn {
        encapsulation vxlan;
        multicast-mode ingress-replication;
        vni-options {
            vni 1010 {
                vrf-target target:65000:1010;
            }
            vni 1020;
            vni 2020 {
                vrf-target target:65000:2020;
            }
        }
        extended-vni-list all;
    }
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                interface-type p2p;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
    lldp {
        interface all;
    }
}
switch-options {
    vtep-source-interface lo0.0;
    route-distinguisher 11.11.11.11:1;
    vrf-target {
        target:65000:1;
        auto;
    }
}
vlans {
    vlan-10 {
        vlan-id 10;
        l3-interface irb.10;
        ##
